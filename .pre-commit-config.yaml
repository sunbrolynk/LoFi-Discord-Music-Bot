default_install_hook_types: [pre-commit, pre-push]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: secret-scanner
        name: Block Secrets & Sensitive Files
        entry: .venv/bin/python scripts/check_secrets.py
        language: system
        stages: [pre-commit, pre-push]
        always_run: false

      - id: ruff-lint
        name: Ruff Linter
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit, pre-push]

      - id: ruff-format
        name: Ruff Formatter Check
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        stages: [pre-commit, pre-push]

      - id: mypy-typecheck
        name: Mypy Static Type Check
        entry: .venv/bin/mypy src tests scripts
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: pytest-pre-push
        name: Pytest Suite (Pre-Push Gate)
        entry: .venv/bin/pytest -v
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]