default_install_hook_types: [pre-commit, pre-push]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: clean-tree
        name: Block a Push With Uncommitted Changes
        entry: bash -c 'test -z "$(git status --porcelain)" || { echo "The gate tests the working tree but the push sends commits; commit or stash first." >&2; git status --short >&2; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gitleaks-staged
        name: Gitleaks Scan of Staged Changes
        entry: bash scripts/check-secrets.sh --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: gitleaks-history
        name: Gitleaks Scan of Every Commit
        entry: bash scripts/check-secrets.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: changelog
        name: Changelog Entry for Every Source Change
        entry: bash scripts/check-changelog.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: secret-scanner
        name: Block Secrets & Sensitive Files
        entry: .venv/bin/python scripts/check_secrets.py
        language: system
        stages: [pre-commit, pre-push]
        always_run: false

      - id: ruff-lint
        name: Ruff Linter
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit, pre-push]

      - id: ruff-format
        name: Ruff Formatter Check
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        stages: [pre-commit, pre-push]

      - id: mypy-typecheck
        name: Mypy Static Type Check
        entry: .venv/bin/mypy src tests scripts
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: pip-audit
        name: Pip-audit Every Lock
        entry: bash scripts/audit-deps.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest-pre-push
        name: Pytest Suite (Pre-Push Gate)
        entry: .venv/bin/pytest -v
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]