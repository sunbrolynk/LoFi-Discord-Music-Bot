name: CI & Publish Container to GHCR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  verify-and-test:
    name: Secret Scan, Lint, Typecheck & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libffi-dev libnacl-dev

      - name: Install hash-pinned dependencies
        run: |
          python -m pip install "pip==24.3.1"
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-dev.txt

      - name: Run Secret Scanner on all tracked files
        run: |
          git ls-files -z | xargs -0 python scripts/check_secrets.py

      - name: Run Ruff Linter & Formatter check
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Run Mypy static type check
        run: |
          mypy src tests scripts

      - name: Run Pytest unit test suite
        run: |
          pytest -v

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: verify-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sunbrolynk/lofi-discord-music-bot:latest
            ghcr.io/sunbrolynk/lofi-discord-music-bot:${{ github.sha }}