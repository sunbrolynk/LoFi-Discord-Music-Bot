name: CI & Publish Container to GHCR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Secret Scan, Lint, Typecheck & Pytest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan Git history for secrets with gitleaks
        run: bash scripts/check-secrets.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libffi-dev libnacl-dev

      - name: Install hash-pinned dependencies
        run: |
          python -m pip install "pip==26.2.1"
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-dev.txt

      - name: Audit every lock with pip-audit
        run: bash scripts/audit-deps.sh

      - name: Run Secret Scanner on all tracked files
        run: |
          git ls-files -z | xargs -0 python scripts/check_secrets.py

      - name: Run Ruff Linter & Formatter check
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Run Mypy static type check
        run: |
          mypy src tests scripts

      - name: Run Pytest unit test suite
        run: |
          pytest -v

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: verify-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sunbrolynk/lofi-discord-music-bot:latest
            ghcr.io/sunbrolynk/lofi-discord-music-bot:${{ github.sha }}